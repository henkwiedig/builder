# userapp1 (slot B, 45 MiB = 360 PEBs of 128 KiB) for ar9311_artosyn_artlynk-p1,
# ubinized by post-image.sh. OpenIPC's NAND layout: the rootfs as UBIFS, which
# the dtb's bootargs mount read-only (root=ubi0:rootfs), and rootfs_data, the
# overlay /init mounts as UBIFS -- created empty, so the first mount formats
# it, and autoresized on the first attach to everything rootfs leaves: about
# 16 MiB, after UBI's 4 own PEBs and the 20 it holds back for bad blocks
# (CONFIG_MTD_UBI_BEB_LIMIT, counted per 1024 PEBs of the whole chip).
[rootfs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
vol_size=24MiB
image=rootfs.ubifs

[rootfs_data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
