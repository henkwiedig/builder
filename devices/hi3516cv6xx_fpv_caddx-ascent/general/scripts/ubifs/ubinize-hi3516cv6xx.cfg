# Board-specific ubinize config for the Caddx Ascent.
#
# The shared general/scripts/ubifs/ubinize.cfg hardcodes vol_size=32MiB for
# the rootfs volume, sized for the other Hi35xx UBI boards. This board's
# rootfs0/rootfs1 NAND partitions are only 16MiB (128 PEBs @ 128KiB), per the
# kernel's mtdparts=...,16M(rootfs0),16M(rootfs1),... — a 32MiB request
# overflows the partition (reserved_pebs 265 > good PEBs 128) and UBI refuses
# to attach ("vtbl_check: too large reserved_pebs").
#
# Fix: omit vol_size on the rootfs volume. ubinize (ubi-utils/ubinize.c) then
# sizes it to the actual rootfs.ubifs image instead of a fixed guess, so this
# keeps working as the image grows/shrinks with package changes. rootfs_data
# gets whatever PEBs remain after bad-block reserve, via autoresize on first
# UBI attach — its vol_size here is only the pre-resize placeholder.
#
# rootfs_data is left as a raw, unformatted UBI volume (no "image="): the
# shared ubinize.cfg does the same, and nothing ever writes a UBIFS
# superblock to it, so mounting it as ubifs fails ("Invalid argument") on
# every board using this scheme's UBI branch. On this device specifically
# it's also too small to fix the same way rootfs_data would need fixing:
# with the current rootfs content (~91 LEBs), only ~13 LEBs are left for
# rootfs_data, but even a completely empty UBIFS filesystem needs ~14 LEBs
# (mkfs.ubifs's own superblock/master/log/lpt/orphan overhead) — 1 LEB
# short. general/overlay/init's mount_usrdata_overlay() uses the dedicated
# usrdata0/usrdata1 partitions (32MiB, pre-formatted via
# tools/make-usrdata-image.sh) as the real overlay instead; rootfs_data
# stays as a best-effort fallback that currently can't succeed here.

[ubifs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
image=BR2_ROOTFS_UBIFS_PATH

[data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=1MiB
vol_flags=autoresize
